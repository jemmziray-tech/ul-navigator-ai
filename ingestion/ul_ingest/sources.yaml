# Seed sources for the UL Navigator AI knowledge base.
# Only public, official University of Limerick pages. The crawler obeys robots.txt,
# rate limits itself and never follows login/authenticated links.
#
# category: used for metadata filtering and source coverage analytics
# year:     academic year the content applies to (auto-detected when omitted)
# discover: follow same-site links from this page (depth limited by CRAWL_MAX_DEPTH)

user_agent_contact: "Set CRAWL_USER_AGENT in .env to include your contact e-mail"

allowed_hosts:
  - www.ul.ie
  - ul.ie
  - www.bookofmodules.ul.ie

# Discovered links must start with one of these path prefixes (seed pages always allowed).
allowed_path_prefixes:
  - /Default.aspx      # official Book of Modules detail pages
  - /academic-registry
  - /policy-hub
  - /study/undergraduate
  - /study/postgraduate
  - /gps
  - /research/doctoral-college
  - /global/incoming-students
  - /fees
  - /accommodation
  - /buildings
  - /library
  - /cecd
  - /student-life
  - /student-affairs
  - /counselling
  - /medical-centre
  - /disability-services
  - /ctl/
  - /eatc
  - /sportsscholarships
  - /study/scholarships
  - /media/            # official documents (PDF downloads)

# Never fetch URLs matching these regular expressions.
exclude_patterns:
  - "/user(/|$)"
  - "/login"
  - "/logout"
  - "/search"
  - "/gaeilge/"
  - "/node/\\d+/edit"
  - "\\.(jpg|jpeg|png|gif|svg|webp|mp4|mp3|zip|docx?|xlsx?|pptx?|ics)$"
  - "mailto:"
  - "tel:"
  - "/news/"
  - "/events/"

# URL path keyword -> category (first match wins) for discovered pages
category_rules:
  - [study/postgraduate, postgraduate]
  - [research/doctoral-college, postgraduate]
  - [/gps, postgraduate]
  - [student-affairs, student_support]
  - [/ctl/, student_support]
  - [/eatc, student_support]
  - [sportsscholarships, scholarships]
  - [accommodation, accommodation]
  - [scholarship, scholarships]
  - [fees, fees]
  - [budget-planner, fees]
  - [visa, international]
  - [global, international]
  - [calendar, calendar]
  - [module-booklet, modules]
  - [bookofmodules, modules]
  - [library, library]
  - [cecd, careers]
  - [careers, careers]
  - [campus-maps, campus]
  - [room-number, campus]
  - [buildings, campus]
  - [orientation, registration]
  - [newstudents, student_support]
  - [student-supports, student_support]
  - [policy, regulations]
  - [academic-regulations, regulations]
  - [prospectus, undergraduate]
  - [study/undergraduate, undergraduate]
  - [academic-registry, registration]


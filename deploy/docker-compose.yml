# Local full stack:  docker compose -f deploy/docker-compose.yml up --build
# Then ingest:       docker compose -f deploy/docker-compose.yml exec api python -m ul_ingest crawl
services:
  api:
    build: { context: .., dockerfile: backend/Dockerfile }
    env_file: ../.env
    environment:
      DATA_DIR: /app/data
      CORS_ORIGINS: http://localhost:3000
      TRUST_PROXY_HEADERS: "false"
    ports: ["8000:8000"]
    volumes: ["ul_data:/app/data"]
    restart: unless-stopped
    # GPU (Linux/WSL2 + NVIDIA Container Toolkit): uncomment and use a CUDA torch build
    # deploy: { resources: { reservations: { devices: [{ capabilities: [gpu] }] } } }
  web:
    build:
      context: ../frontend
      args: { NEXT_PUBLIC_API_URL: http://localhost:8000 }
    ports: ["3000:3000"]
    depends_on: [api]
    restart: unless-stopped
volumes:
  ul_data:
